# Seed local config presets for the Playwright UI suite.
#
# Copied into the scratch PLUGINS_DIR at test setup and whitelisted there as
# `configs/local-presets.conf <sha256>`. Never installed anywhere real.
#
# Format: <key>=<command> <param1>=<value1> <param2>=<value2> ...
# Values must not contain spaces or '#'.

# A plain, non-secret preset. Rendered as a stored entry, so it gets the
# "Run from Nagios" command line in the editor.
ui_basic=check-ui-echo message=hello code=0 repeat=1 flag=false

# A preset carrying a secret. The token is name- AND type-matched as secret, so
# the editor must mask it and show the "stored" placeholder instead.
ui_secret=check-ui-secret token=s3cr3t-seed-value endpoint=https://example.invalid

# A preset with a parameter the plugin never declares, to prove undeclared
# params are rendered with the "(undeclared)" hint rather than dropped.
ui_undeclared=check-ui-minimal mystery=kept
