# The environment in which the Nest application will run (e.g., development, production)
NODE_ENV=production
# The hostname or IP address where the Nest application will run
HOST=localhost
# The port on which the Nest application will listen
PORT=5000
# Directory where Nest plugins are stored
PLUGINS_DIR=/opt/nest-plugins
# Approved SHA-256 of the local config presets file (configs/local-presets.conf).
# The trusted hash lives here (root-owned, a dpkg conffile) rather than in the
# plugins directory. Empty means no approved hash, so the presets file is treated
# as unapproved at startup. Run "nest plugins hash" to compute and write it. Each
# plugin's own hash lives in its sidecar manifest (<name>.manifest.json).
LOCAL_CONFIG_HASH=
# Master key for encrypting secrets stored in local-presets.conf. Created by the
# package postinst (0600, root-owned) and kept OUTSIDE the plugins directory so
# the admin editor cannot read or overwrite it. Back this file up: without it,
# encrypted secrets cannot be recovered.
SECRET_KEY_PATH=/etc/nest/nest.key
# Path to the log file
LOG_FILE_PATH=/var/log/nest/nest.log
# Maximum size of the log file in bytes
MAX_LOG_FILE_SIZE_BYTES=1048576
# API key for authenticating with external services (replace with your actual API key)
API_KEY=
# Comma-separated list of allowed IP addresses for accessing the Nest application
# Default: 127.0.0.1,::1 (loopback only for IPv4 and IPv6)
# Use * to allow all IPs (NOT recommended for production)
# Do not mix * with specific IPs (e.g., "127.0.0.1,*" is invalid)
ALLOWED_IPS=127.0.0.1,::1
# Honour the X-Forwarded-For header when resolving the client IP. Leave this
# disabled unless Nest runs behind a reverse proxy you control, otherwise a
# client can spoof its address and bypass ALLOWED_IPS.
# Values: false (default), true (trust every peer), a number of proxy hops,
# or a comma-separated list of trusted proxy IPs/CIDRs.
TRUST_PROXY=false
# Password for the admin web UI at /admin (local config editor). It is separate
# from API_KEY: the monitoring key alone must never be able to rewrite the
# config file. Leave empty to keep the UI locked; it then serves a "not
# configured" page and startup prints a warning.
ADMIN_UI_PASSWORD=